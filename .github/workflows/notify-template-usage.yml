name: Notify template usage

on:
  push:
    branches:
      - main

# The deletion commit must be allowed to update the default branch.
permissions:
  contents: write

jobs:
  notify-template-usage:
    runs-on: ubuntu-latest

    steps:
      - name: Check whether the repository was created from a template
        id: template
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          template_repository="$(gh api "repos/${{ github.repository }}" --jq '.template_repository.full_name // ""')"

          if [[ -z "$template_repository" ]]; then
            echo "This repository was not created from a template; nothing to do."
            echo "is_template=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Template repository: $template_repository"
          echo "is_template=true" >> "$GITHUB_OUTPUT"
          echo "template_repository=$template_repository" >> "$GITHUB_OUTPUT"
          echo "template_name=${template_repository##*/}" >> "$GITHUB_OUTPUT"

      - name: Confirm the one-time workflow is still present
        id: one_time_guard
        if: ${{ steps.template.outputs.is_template == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          error_file="$RUNNER_TEMP/notify-template-workflow-check.err"
          if workflow_sha="$(gh api "repos/${{ github.repository }}/contents/.github/workflows/notify-template-usage.yml?ref=main" --jq '.sha' 2>"$error_file")"; then
            echo "One-time workflow found at $workflow_sha."
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          elif grep -q '404' "$error_file"; then
            echo "The one-time workflow is already absent; skipping notification."
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi

      - name: Notify Slack
        if: ${{ steps.one_time_guard.outputs.should_notify == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEMPLATE_REPOSITORY: ${{ steps.template.outputs.template_repository }}
          TEMPLATE_NAME: ${{ steps.template.outputs.template_name }}
          REPOSITORY_URL: 'https://github.com/${{ github.repository }}'
          AUTHOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail

          json_escape() {
            local value=$1 escaped='' char index
            for ((index = 0; index < ${#value}; index++)); do
              char=${value:index:1}
              case "$char" in
                \\) escaped+='\\' ;;
                '"') escaped+='\"' ;;
                $'\n') escaped+='\n' ;;
                $'\r') escaped+='\r' ;;
                $'\t') escaped+='\t' ;;
                *) escaped+="$char" ;;
              esac
            done
            printf '%s' "$escaped"
          }

          template_json="$(json_escape "$TEMPLATE_REPOSITORY")"
          template_name_json="$(json_escape "$TEMPLATE_NAME")"
          repository_url_json="$(json_escape "$REPOSITORY_URL")"
          author_json="$(json_escape "$AUTHOR")"

          payload="$(cat <<EOF
          {
            "text": "A new repository was created from a GitHub template.",
            "attachments": [
              {
                "color": "#2eb886",
                "fields": [
                  {
                    "title": "Template",
                    "value": "${template_name_json} (${template_json})",
                    "short": true
                  },
                  {
                    "title": "Repository",
                    "value": "<${repository_url_json}|${repository_url_json}>",
                    "short": true
                  },
                  {
                    "title": "Author",
                    "value": "${author_json}",
                    "short": true
                  }
                ]
              }
            ]
          }
          EOF
          )"

          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"

      - name: Delete the one-time workflow
        if: ${{ steps.one_time_guard.outputs.should_notify == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PATH: .github/workflows/notify-template-usage.yml
        shell: bash
        run: |
          set -euo pipefail

          repository_directory="$RUNNER_TEMP/template-usage-repository"
          git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
            clone --depth=1 --no-tags --branch main \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "$repository_directory"

          if [[ ! -f "$repository_directory/$WORKFLOW_PATH" ]]; then
            echo "The workflow was already removed; nothing to commit."
            exit 0
          fi

          git -C "$repository_directory" config user.name "github-actions[bot]"
          git -C "$repository_directory" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repository_directory" rm -- "$WORKFLOW_PATH"
          git -C "$repository_directory" commit \
            --message "chore: remove one-time template usage notification workflow"
          git -C "$repository_directory" \
            -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
            push origin HEAD:main
