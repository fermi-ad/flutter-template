name: Continuous Deployment for Flutter applications

on:
  push:
    branches:
      - "main"

jobs:
  build-and-deploy:
    uses: fermi-ad/.github/.github/workflows/flutter-deploy.yaml@e3bc6a8fc30678d1509d0db9d312cd80e549e867
    secrets: inherit
    permissions:
      contents: write
    # Optional: Change to true to pull in git submodules during build
    with:
      pull-git-submodules: false
